# ============================================================
# SESPORT — Nginx reverse proxy
#
# DIQQAT: bu fayl /etc/nginx/conf.d/default.conf ga mount qilinadi,
# ya'ni u allaqachon `http { ... }` blokining ICHIDA joylashadi.
# Shu sabab bu yerda `user`, `events`, `http` direktivalari BO'LMASLIGI
# kerak — aks holda nginx "directive is not allowed here" bilan yiqiladi.
#
# Konteyner ichida 80/443 tinglaydi.
# Tashqi portlar docker-compose.yml da: 2020->80, 443->443
# ============================================================

upstream django {
    server web:8000;
    keepalive 16;
}

# Nginx versiyasini javob sarlavhalarida ko'rsatmaslik
server_tokens off;

# ── Umumiy proxy va xavfsizlik sozlamalari ──────────────────
# HTTP va HTTPS server bloklari uchun `include` orqali qayta ishlatiladi.
# (Alohida faylga chiqarmaslik uchun map/snippet o'rniga takrorlanadi.)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Let's Encrypt HTTP-01 challenge ──
    # certbot --webroot -w /var/www/certbot ishlatilganda kerak.
    # Volume ochilganda ishlaydi; ochilmagan bo'lsa 404 qaytaradi — zarari yo'q.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ── Nginx o'zining healthcheck'i (Django'ga tegmaydi) ──
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    # ─────────────────────────────────────────────────────────
    # HTTPS yoqilganda: quyidagi redirectni oching va .env da
    # ENABLE_HTTPS=true qiling.
    #
    # location / {
    #     return 301 https://$host$request_uri;
    # }
    # ─────────────────────────────────────────────────────────

    include /etc/nginx/conf.d/sesport-app.inc;
}

# ============================================================
# HTTPS — sertifikat olingandan keyin oching
#
# 1) docker-compose.yml da letsencrypt volume'ini oching
# 2) sertifikat oling:
#      docker run --rm -p 80:80 \
#        -v /etc/letsencrypt:/etc/letsencrypt \
#        certbot/certbot certonly --standalone -d sizning-domen.uz
#    (yoki webroot usuli bilan — yuqoridagi acme-challenge location orqali)
# 3) quyidagi blokni izohdan chiqaring va domenni yozing
# 4) .env: ENABLE_HTTPS=true, CSRF_TRUSTED_ORIGINS=https://sizning-domen.uz
# 5) docker compose --profile production up -d
