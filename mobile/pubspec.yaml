name: sesportuz
description: "SESPORT — Sanitariya-epidemiologik xavfsizlik va iste'molchilar huquqini himoya qilish milliy mobil ilovasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking & API
  http: ^1.2.0
  
  # Hardware Camera & Gallery
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  
  # Geolocation & Maps
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.3
  
  # Local Storage & Preferences
  shared_preferences: ^2.2.2
  
  # UI & Animations
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  url_launcher: ^6.2.5
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
