<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SESPORT — Jonli Kamera</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --dark-bg: #090d16;
            --surface: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Header */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(220, 38, 38, 0.25);
            border: 1px solid rgba(220, 38, 38, 0.5);
            color: #fca5a5;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .badge-live::before {
            content: "";
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.4; }
            100% { transform: scale(0.9); opacity: 1; }
        }

        .torch-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .torch-btn.active {
            background: #fbbf24;
            color: #000;
            border-color: #f59e0b;
        }

        /* Camera Viewport */
        .camera-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video, #previewImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        #previewImage {
            display: none;
            z-index: 10;
        }

        /* Viewfinder Overlay */
        .viewfinder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 60vh;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            pointer-events: none;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
        }

        .guide-text {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
        }

        /* Flash Screen effect */
        .flash-overlay {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 30;
            transition: opacity 0.15s ease-out;
        }
        .flash-overlay.active {
            opacity: 0.9;
        }

        /* Controls Bottom Bar */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 24px 20px 36px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
        }

        /* Shutter Button */
        .shutter-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s, background-color 0.15s;
            outline: none;
        }

        .shutter-btn:active {
            transform: scale(0.92);
            background: #e2e8f0;
        }

        .shutter-inner {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #000;
        }

        /* Preview Action Buttons */
        .preview-actions {
            display: none;
            width: 100%;
            max-width: 360px;
            gap: 12px;
            justify-content: space-between;
        }

        .btn {
            flex: 1;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s, opacity 0.15s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-retake {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(10px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .btn-submit {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        .btn-submit:disabled {
            background: #475569;
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Fallback input */
        #fallbackCameraInput {
            display: none;
        }

        .error-overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 13, 22, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 50;
        }
        .error-overlay h3 {
            margin-bottom: 10px;
            color: #f87171;
        }
        .error-overlay p {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <div class="header">
        <div class="badge-live">JONLI KAMERA</div>
        <button type="button" id="torchBtn" class="torch-btn" title="Chiroq" style="display: none;">🔦</button>
    </div>

    <!-- Camera / Preview Area -->
    <div class="camera-container">
        <video id="video" autoplay playsinline muted></video>
        <img id="previewImage" alt="Olingan rasm">
        <canvas id="canvas" style="display: none;"></canvas>

        <div class="viewfinder" id="viewfinder">
            <div class="guide-text">Mahsulot va yaroqlilik muddatini ramkaga to'g'rilang</div>
            <div class="guide-text">Faqat voqea joyidagi rasm qabul qilinadi</div>
        </div>

        <div class="flash-overlay" id="flashOverlay"></div>
    </div>

    <!-- Bottom Controls -->
    <div class="controls">
        <!-- Capture Mode -->
        <button type="button" class="shutter-btn" id="shutterBtn" aria-label="Rasmga olish">
            <div class="shutter-inner"></div>
        </button>

        <!-- Preview Mode Actions -->
        <div class="preview-actions" id="previewActions">
            <button type="button" class="btn btn-retake" id="retakeBtn">
                <span>🔄 Qayta olish</span>
            </button>
            <button type="button" class="btn btn-submit" id="submitBtn">
                <span id="submitBtnText">✅ Yuborish</span>
                <div class="spinner" id="submitSpinner" style="display: none;"></div>
            </button>
        </div>
    </div>

    <!-- Fallback Direct Capture Input -->
    <input type="file" id="fallbackCameraInput" accept="image/*" capture="environment">

    <!-- Error Overlay -->
    <div class="error-overlay" id="errorOverlay">
        <h3>📷 Kamera ochilmadi</h3>
        <p id="errorMessage">Brauzerda kamera ruxsati berilmagan yoki qurilma qo'llab-quvvatlamaydi.</p>
        <button type="button" class="btn btn-submit" id="fallbackBtn">
            📸 Kamerani qayta ochish
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#090d16');
            tg.setBackgroundColor('#090d16');
            tg.enableClosingConfirmation();
        }

        const video = document.getElementById('video');
        const previewImage = document.getElementById('previewImage');
        const canvas = document.getElementById('canvas');
        const viewfinder = document.getElementById('viewfinder');
        const flashOverlay = document.getElementById('flashOverlay');
        const shutterBtn = document.getElementById('shutterBtn');
        const previewActions = document.getElementById('previewActions');
        const retakeBtn = document.getElementById('retakeBtn');
        const submitBtn = document.getElementById('submitBtn');
        const submitBtnText = document.getElementById('submitBtnText');
        const submitSpinner = document.getElementById('submitSpinner');
        const torchBtn = document.getElementById('torchBtn');
        const fallbackCameraInput = document.getElementById('fallbackCameraInput');
        const errorOverlay = document.getElementById('errorOverlay');
        const fallbackBtn = document.getElementById('fallbackBtn');

        let mediaStream = null;
        let imageBlob = null;
        let capturedDataUrl = null;
        let torchTrack = null;
        let isTorchOn = false;

        // Initialize Camera with robust fallbacks
        async function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                // Device does not support getUserMedia stream -> use direct hardware capture
                fallbackBtn.style.display = 'block';
                showError("To'g'ridan-to'g'ri kamera orqali rasmga olish uchun pastdagi tugmani bosing.");
                return;
            }

            const constraintList = [
                { audio: false, video: { facingMode: { ideal: "environment" } } },
                { audio: false, video: { facingMode: "environment" } },
                { audio: false, video: true }
            ];

            let started = false;
            for (const constraints of constraintList) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = mediaStream;
                    await video.play();
                    started = true;
                    break;
                } catch (e) {
                    console.warn("Constraint attempt failed:", constraints, e);
                }
            }

            if (started) {
                const track = mediaStream.getVideoTracks()[0];
                if (track) {
                    torchTrack = track;
                    const capabilities = track.getCapabilities?.() || {};
                    if (capabilities.torch) {
                        torchBtn.style.display = 'flex';
                    }
                }
                errorOverlay.style.display = 'none';
            } else {
                showError("Kamera oqimiga ulanib bo'lmadi. Kamerani to'g'ridan-to'g'ri ochish uchun pastdagi tugmani bosing:");
            }
        }

        function showError(msg) {
            document.getElementById('errorMessage').innerText = msg;
            errorOverlay.style.display = 'flex';
        }

        fallbackBtn.addEventListener('click', () => {
            fallbackCameraInput.click();
        });

        fallbackCameraInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    capturedDataUrl = event.target.result;
                    showPreview(capturedDataUrl);
                    errorOverlay.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        // Flashlight toggle
        torchBtn.addEventListener('click', async () => {
            if (!torchTrack) return;
            try {
                isTorchOn = !isTorchOn;
                await torchTrack.applyConstraints({
                    advanced: [{ torch: isTorchOn }]
                });
                torchBtn.classList.toggle('active', isTorchOn);
            } catch (e) {
                console.error("Torch error:", e);
            }
        });

        // Capture Photo
        shutterBtn.addEventListener('click', () => {
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            // If live stream is not ready, open hardware camera directly
            if (!mediaStream || !video.videoWidth) {
                fallbackCameraInput.click();
                return;
            }

            // Flash effect
            flashOverlay.classList.add('active');
            setTimeout(() => flashOverlay.classList.remove('active'), 120);

            // Draw to canvas
            const width = video.videoWidth || 1280;
            const height = video.videoHeight || 720;
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, width, height);

            capturedDataUrl = canvas.toDataURL('image/jpeg', 0.88);
            showPreview(capturedDataUrl);
        });

        function showPreview(dataUrl) {
            previewImage.src = dataUrl;
            previewImage.style.display = 'block';
            video.style.display = 'none';
            viewfinder.style.display = 'none';
            shutterBtn.style.display = 'none';
            previewActions.style.display = 'flex';
            torchBtn.style.display = 'none';
        }

        // Retake
        retakeBtn.addEventListener('click', () => {
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
            previewImage.style.display = 'none';
            video.style.display = 'block';
            viewfinder.style.display = 'flex';
            shutterBtn.style.display = 'flex';
            previewActions.style.display = 'none';
            if (torchTrack?.getCapabilities?.()?.torch) {
                torchBtn.style.display = 'flex';
            }
            capturedDataUrl = null;
        });

        // Submit to Backend & Telegram
        submitBtn.addEventListener('click', async () => {
            if (!capturedDataUrl) return;

            submitBtn.disabled = true;
            submitBtnText.style.display = 'none';
            submitSpinner.style.display = 'block';

            if (tg?.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }

            try {
                const response = await fetch('/api/upload-camera/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image: capturedDataUrl,
                        timestamp: new Date().toISOString()
                    })
                });

                const result = await response.json();

                if (result.success) {
                    // Send confirmation data back to bot
                    const payload = {
                        action: 'camera_photo',
                        file_name: result.file_name,
                        file_path: result.file_path,
                        file_url: result.file_url
                    };

                    if (tg && tg.sendData) {
                        tg.sendData(JSON.stringify(payload));
                        tg.close();
                    } else {
                        alert("✅ Rasm qabul qilindi! Telegram botga qayting.");
                    }
                } else {
                    throw new Error(result.error || "Rasm yuklashda xatolik yuz berdi");
                }
            } catch (err) {
                alert("⚠️ Xatolik: " + err.message);
                submitBtn.disabled = false;
                submitBtnText.style.display = 'block';
                submitSpinner.style.display = 'none';
            }
        });

        // Start on load
        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
