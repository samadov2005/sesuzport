version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: sesport_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sesport_db}
      POSTGRES_USER: ${POSTGRES_USER:-sesport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sesport_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sesport_user} -d ${POSTGRES_DB:-sesport_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache + FSM Storage
  redis:
    image: redis:7-alpine
    container_name: sesport_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Web Application
  web:
    build: .
    container_name: sesport_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py shell -c \"
             from django.contrib.auth import get_user_model;
             import os;
             User = get_user_model();
             username = os.environ.get('DJANGO_SUPERUSER_USERNAME', 'admin');
             email = os.environ.get('DJANGO_SUPERUSER_EMAIL', 'admin@sesport.uz');
             password = os.environ.get('DJANGO_SUPERUSER_PASSWORD', 'admin123');
             User.objects.filter(username=username).exists() or User.objects.create_superuser(username=username, email=email, password=password);
             print('Superuser ready.')
             \" &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Telegram Bot Service
  bot:
    build: .
    container_name: sesport_bot
    restart: unless-stopped
    command: python -m bot.main
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      USE_REDIS: "true"
    volumes:
      - .:/app
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  # Nginx Reverse Proxy (Optional but recommended for production)
  nginx:
    image: nginx:alpine
    container_name: sesport_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
