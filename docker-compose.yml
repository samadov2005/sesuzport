# ============================================================
# SESPORT — Docker Compose (production)
#
# ARXITEKTURA: reverse proxy va SSL termination — tashqi
# Nginx Proxy Manager (NPM). Loyiha ichida nginx servisi YO'Q.
#
#   Internet ──80/443──> Nginx Proxy Manager
#                              │  npm_network
#                              ▼
#                          web:8000  (Gunicorn)
#                              │  backend
#                        ┌─────┴─────┐
#                        ▼           ▼
#                     db:5432    redis:6379
#                        ▲           ▲
#                        └─── bot ───┘
#
# HECH BIR SERVIS HOST'GA PORT PUBLISH QILMAYDI.
#
# Ishga tushirish:
#   docker network ls                     # NPM network nomini toping
#   echo "NPM_NETWORK=<nom>" >> .env
#   docker compose up -d --build
#
# NPM Docker'da bo'lmasa (host'da o'rnatilgan bo'lsa):
#   docker compose -f docker-compose.yml -f docker-compose.hostport.yml up -d
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── PostgreSQL ────────────────────────────────────────────
  # Faqat `backend` network. Host'ga port chiqarilmagan.
  db:
    image: postgres:16-alpine
    container_name: sesport_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB .env da belgilanishi shart}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER .env da belgilanishi shart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da belgilanishi shart}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis (aiogram FSM storage) ───────────────────────────
  # Faqat `backend` network. Redis'da auth yo'q — uni hech qachon
  # host'ga yoki npm_network'ga chiqarmang.
  redis:
    image: redis:7-alpine
    container_name: sesport_redis
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
      --appendonly yes
      --save 60 1
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Django / Gunicorn ─────────────────────────────────────
  # YAGONA servis npm_network'da — NPM unga `web:8000` orqali yetadi.
  # `expose` faqat konteynerlararo; host'ga hech narsa publish qilinmaydi.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sesport-app:latest
    container_name: sesport_web
    restart: unless-stopped
    init: true
    logging: *default-logging
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      # Migratsiya / collectstatic / superuser FAQAT shu servisda —
      # bot'da o'chirilgan, aks holda parallel migratsiya race beradi.
      RUN_MIGRATIONS: "true"
      RUN_COLLECTSTATIC: "true"
      CREATE_SUPERUSER: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    networks:
      - backend       # db + redis
      - npm_network   # NPM shu yerdan `web:8000` ga yetadi
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Telegram bot (long polling) ───────────────────────────
  # npm_network'da EMAS — bot'ga tashqaridan kirish kerak emas.
  # `backend` oddiy bridge (internal emas), shuning uchun bot
  # api.telegram.org ga chiqa oladi.
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: sesport-app:latest
    container_name: sesport_bot
    restart: unless-stopped
    init: true
    logging: *default-logging
    command: ["python", "-m", "bot.main"]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      USE_REDIS: "true"
      RUN_MIGRATIONS: "false"
      RUN_COLLECTSTATIC: "false"
      CREATE_SUPERUSER: "false"
    volumes:
      # media_volume ATAYLAB yo'q: bot lokal faylga yozmaydi — shikoyat
      # rasm/ovozlari Telegram `file_id` sifatida saqlanadi
      # (apps/complaints/models.py: photo_file_id).
      - logs_volume:/app/logs
    networks:
      - backend
    # Image'dagi HTTP healthcheck bot uchun mos emas — u web server emas.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # HTTP uchun emas — MIGRATSIYA uchun. Bot Django ORM orqali
      # TelegramUser/Complaint jadvallariga murojaat qiladi
      # (bot/middlewares/user_registration.py). Migratsiyani `web`
      # bajaradi, shuning uchun bot u sog'lom bo'lgunicha kutadi —
      # aks holda birinchi /start da "relation does not exist".
      web:
        condition: service_healthy

networks:
  # Ichki tarmoq: db, redis, web, bot.
  # `internal: true` ATAYLAB qo'yilmagan — bot'ga api.telegram.org
  # bilan ishlash uchun tashqi chiqish (egress) kerak.
  # Xavfsizlik host'ga port publish qilmaslik bilan ta'minlanadi.
  backend:
    driver: bridge
    name: sesport_backend

  # Nginx Proxy Manager allaqachon yaratgan tarmoq.
  # Nomini aniqlash:
  #   docker inspect <npm-container> \
  #     --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}'
  # So'ng .env ga: NPM_NETWORK=<topilgan-nom>
  npm_network:
    external: true
    name: ${NPM_NETWORK:-npm_network}

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
